<section>
  <h1>Event Binding with Angular</h1>

  <h2>(click) binding</h2>
  <button type="button" class="btn btn-success" (click)="increment()">Click me</button>
  <button type="button" class="btn btn-outline-secondary ms-2" (click)="reset()">Reset</button>
  <p class="mt-2">Clicked <strong>{{ count() }}</strong> time(s).</p>
  <hr />

  <h2>(keydown) binding with <code>$event</code></h2>
  <input
    type="text"
    class="form-control"
    placeholder="Type to see the last key…"
    (keydown)="onKeydown($event)"
  />
  <p class="mt-2">Last key pressed: <strong>{{ lastKey() }}</strong></p>
</section>
