<div class="demo-section">
  <mat-slider min="1" max="100" step="1">
    <input matSliderThumb [value]="initialValue" />
  </mat-slider>
</div>

<div class="demo-section">
  <p>Default icon color</p>
  <mat-icon>person</mat-icon>
</div>

<div class="demo-section">
  <p>Primary icon color</p>
  <mat-icon color="primary">thumb_up</mat-icon>
</div>

<div class="demo-section">
  <p>Accent icon color</p>
  <mat-icon color="accent">info</mat-icon>
</div>

<div class="demo-section">
  <p>Warn icon color</p>
  <mat-icon color="warn">warning</mat-icon>
</div>
