<h3>Employee List</h3>

@if (loading()) {
  <p>Loading…</p>
}

<table class="employee-table">
  <thead>
    <tr>
      <th>Name</th>
      <th>Email</th>
      <th>Phone</th>
      <th>Actions</th>
    </tr>
  </thead>
  <tbody>
    @for (employee of employees(); track employee.id) {
      <tr>
        <td>{{ employee.name }}</td>
        <td>{{ employee.email }}</td>
        <td>{{ employee.phone }}</td>
        <td>
          <a routerLink="/employee-edit/{{ employee.id }}">Edit</a>
          <button type="button" (click)="remove(employee.id!)">Delete</button>
        </td>
      </tr>
    } @empty {
      <tr>
        <td colspan="4">No employees yet.</td>
      </tr>
    }
  </tbody>
</table>

<p><a routerLink="/create-employee">Create new employee</a></p>
