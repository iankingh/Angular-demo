<h3>Create Employee</h3>

<form (ngSubmit)="addEmployee()">
  <div class="form-group">
    <label for="name">Name</label>
    <input id="name" name="name" type="text" [(ngModel)]="employee.name" required />
  </div>

  <div class="form-group">
    <label for="email">Email</label>
    <input id="email" name="email" type="email" [(ngModel)]="employee.email" required />
  </div>

  <div class="form-group">
    <label for="phone">Phone</label>
    <input id="phone" name="phone" type="number" [(ngModel)]="employee.phone" required />
  </div>

  <button type="submit" class="btn-success">Create Employee</button>
</form>
