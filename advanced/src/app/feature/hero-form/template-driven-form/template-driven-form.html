<form (ngSubmit)="submit(heroForm.value)" #heroForm="ngForm" appCrossFieldValidate>
  <div class="form-group">
    <label for="name">姓名：</label>
    <input
      type="text"
      name="name"
      id="name"
      [(ngModel)]="hero.name"
      class="form-control"
      autocomplete="off"
      required
      minlength="4"
      #name="ngModel"
      appHeroValidate
    />
    <div *ngIf="name.invalid && (name.dirty || name.touched)" class="alert alert-danger">
      <div *ngIf="name.errors?.['required']">姓名不能為空</div>
      <div *ngIf="name.errors?.['minlength']">姓名資訊不能少於 4 個字元長度</div>
      <div *ngIf="name.errors?.['heroNameInvalid']">姓名無效</div>
    </div>
  </div>

  <div class="form-group">
    <label for="age">年齡：</label>
    <input type="number" name="age" id="age" [(ngModel)]="hero.age" class="form-control" required />
    <div
      *ngIf="heroForm.errors?.['nameAgeInvalid'] && (heroForm.touched || heroForm.dirty)"
      class="alert alert-danger"
    >
      lala 不能是 12 歲
    </div>
  </div>

  <div class="form-group">
    <label>性別：</label>
    <div class="form-check" *ngFor="let gender of genders">
      <input
        class="form-check-input"
        type="radio"
        name="gender"
        id="{{ gender.id }}"
        [value]="gender.value"
        [(ngModel)]="hero.gender"
      />
      <label class="form-check-label" for="{{ gender.id }}">{{ gender.text }}</label>
    </div>
  </div>

  <div class="form-group">
    <label for="location">住址：</label>
    <select name="location" id="location" [(ngModel)]="hero.location" class="form-control" required>
      <option *ngFor="let location of locations" [value]="location">{{ location }}</option>
    </select>
  </div>

  <button type="submit" [disabled]="!heroForm.form.valid" class="btn btn-primary">Submit</button>
</form>

<p>表單資料：{{ hero | json }}</p>
