<form [formGroup]="profileForm" (ngSubmit)="submit()">
  <div class="form-group">
    <label for="name">姓名：</label>
    <input
      type="text"
      id="name"
      formControlName="name"
      class="form-control"
      autocomplete="off"
      required
      minlength="4"
    />
    <div *ngIf="name.invalid && (name.dirty || name.touched)" class="alert alert-danger">
      <div *ngIf="name.errors?.['required']">姓名不能為空</div>
      <div *ngIf="name.errors?.['minlength']">姓名資訊不能少於 4 個字元長度</div>
      <div *ngIf="name.errors?.['heroNameInvalid']">姓名無效</div>
    </div>
  </div>

  <div class="form-group">
    <label for="age">年齡：</label>
    <input type="number" id="age" formControlName="age" class="form-control" autocomplete="off" step="1" />
    <div
      *ngIf="profileForm.errors?.['nameAgeInvalid'] && (profileForm.touched || profileForm.dirty)"
      class="alert alert-danger"
    >
      lala 不能是 12 歲
    </div>
  </div>

  <div formGroupName="address">
    <div class="form-group">
      <label for="province">省：</label>
      <input type="text" id="province" formControlName="province" class="form-control" />
    </div>
    <div class="form-group">
      <label for="city">市：</label>
      <input type="text" id="city" formControlName="city" class="form-control" />
    </div>
    <div class="form-group">
      <label for="district">區：</label>
      <input type="text" id="district" formControlName="district" class="form-control" />
    </div>
    <div class="form-group">
      <label for="street">街道：</label>
      <input type="text" id="street" formControlName="street" class="form-control" />
    </div>
  </div>

  <button type="button" class="btn btn-secondary" (click)="updateProfile()">更新資訊</button>
  <button type="submit" class="btn btn-primary" [disabled]="!profileForm.valid">資料提交</button>
</form>

<p>FormGroup 表單值：{{ profileForm.value | json }}</p>
